<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Twitch Bot Admin Panel</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Twitch Bot Admin Panel</h1>
    
    <div class="status-container">
      <div class="status">
        Bot Status: <span id="botStatus">Disconnected</span>
      </div>
      <div class="channel">
        Channel: <span id="channelName">-</span>
      </div>
    </div>

    <div class="logs">
      <h2>Bot Logs</h2>
      <div id="logContainer"></div>
    </div>

    <div class="controls">
      <button class="download-btn">Download Bot Source</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.1/socket.io.min.js"></script>
  <script src="client.js"></script>
